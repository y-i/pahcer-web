[package]
name = "pahcer-web"
version = "0.3.0"
edition = "2024"
description = "Rust backend for pahcer-web"
license = "MIT"

[dependencies]
axum = "0.8.4"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
futures-util = "0.3.31"
mime_guess = "2.0.5"
regex = "1.11.2"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "json", "rustls-tls", "stream"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["io"] }
toml = "0.9.7"
tower-http = { version = "0.6.6", features = ["fs"] }
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.0.17"
http-body-util = "0.1.3"
predicates = "3.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
