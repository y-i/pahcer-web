on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: rust

      - uses: actions/checkout@v7
        if: ${{ steps.rp.outputs.releases_created == 'true' }}

      - uses: actions/setup-node@v7
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: frontend
        run: npm run build

      - name: Stage frontend assets
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        run: node cli/scripts/stage-frontend.mjs

      - uses: dtolnay/rust-toolchain@fef302ccf927bb57eda82b1967aefb2033c6a515 # v1.100.0
        if: ${{ steps.rp.outputs.releases_created == 'true' }}

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        with:
          url: https://crates.io

      - name: Publish Rust package
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        working-directory: cli
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
